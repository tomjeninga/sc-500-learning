name: IaC validate (Bicep + ARM)

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/**'
      - '**/templates/*.json'
      - '.github/workflows/iac-validate.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '**/templates/*.json'
      - '.github/workflows/iac-validate.yml'

permissions:
  contents: read

jobs:
  bicep-build:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: |
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: Build every .bicep file
        run: |
          set -e
          shopt -s globstar nullglob
          FAILED=0
          for f in infra/**/*.bicep; do
            echo "::group::bicep build $f"
            if ! bicep build "$f" --stdout > /dev/null; then
              echo "::error file=$f::Bicep build failed"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          exit $FAILED

  arm-validate:
    name: ARM template validate (JSON + schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: JSON syntax + ARM schema check
        run: |
          set -e
          shopt -s globstar nullglob
          FAILED=0
          for f in **/templates/*.json; do
            [[ "$f" == *".parameters.json" ]] && continue
            echo "::group::validate $f"

            # 1. JSON must parse
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error file=$f::Invalid JSON"
              FAILED=1
              echo "::endgroup::"
              continue
            fi

            # 2. Must have an ARM/Bicep-compatible $schema and contentVersion
            SCHEMA=$(jq -r '."$schema" // empty' "$f")
            CV=$(jq -r '.contentVersion // empty' "$f")
            RES=$(jq -r '.resources | type' "$f")

            if [[ -z "$SCHEMA" ]]; then
              echo "::error file=$f::Missing \$schema property"
              FAILED=1
            elif [[ "$SCHEMA" != *"deploymentTemplate.json"* && "$SCHEMA" != *"subscriptionDeploymentTemplate.json"* && "$SCHEMA" != *"managementGroupDeploymentTemplate.json"* && "$SCHEMA" != *"tenantDeploymentTemplate.json"* ]]; then
              echo "::error file=$f::Unrecognized ARM \$schema: $SCHEMA"
              FAILED=1
            fi

            if [[ -z "$CV" ]]; then
              echo "::error file=$f::Missing contentVersion"
              FAILED=1
            fi

            if [[ "$RES" != "array" && "$RES" != "object" ]]; then
              echo "::error file=$f::Missing or invalid resources block"
              FAILED=1
            fi

            echo "OK $f (schema: $(basename $SCHEMA), resources: $RES)"
            echo "::endgroup::"
          done
          exit $FAILED
